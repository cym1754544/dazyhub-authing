<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
  <title id="title">DazyHub capybara logo</title>
  <desc id="desc">A friendly cartoon capybara wearing black glasses while using a laptop, with DazyHub integrated into the logo.</desc>
  <defs>
    <linearGradient id="badgeGradient" x1="130" y1="118" x2="1260" y2="1282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8dd8a"/>
      <stop offset=".46" stop-color="#f4a65d"/>
      <stop offset="1" stop-color="#5eb7b7"/>
    </linearGradient>
    <linearGradient id="screenGradient" x1="423" y1="790" x2="977" y2="1032" gradientUnits="userSpaceOnUse">
