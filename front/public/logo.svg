        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .soft-line {
        stroke: #6b3e22;
        stroke-width: 12;
        stroke-linecap: round;
        fill: none;
        opacity: .42;
      }
      .wordmark {
        font-family: "Comic Sans MS", "Marker Felt", "Avenir Next", "Nunito Sans", "Inter", "Arial Rounded MT Bold", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 0;
      }
    </style>
  </defs>


