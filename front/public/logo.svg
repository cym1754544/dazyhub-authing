      <stop offset=".57" stop-color="#152839"/>
      <stop offset="1" stop-color="#0f1f2f"/>
    </linearGradient>
    <linearGradient id="furGradient" x1="406" y1="309" x2="1024" y2="898" gradientUnits="userSpaceOnUse">
